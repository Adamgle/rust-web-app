[package]
name = "rust-web-app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.44", features = ["serde"] }
console-subscriber = { version = "0.5.0" }
dashmap = "6.1.0"
dotenvy = "0.15.7"
# dotenv = "0.15.0" => That is not maintained anymore.
futures = "0.3.32"
futures-util = "0.3.32"
hex = "0.4.3"
hmac = "0.12.1"
http-body-util = "0.1.3"
rand = "0.9.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serial_test = "3.4.0" # That should probably be a dev-dependency only as it is used only in tests.
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "derive",
    'chrono',
    "uuid",
    'migrate'
    # 'time',
    # "json" => Add support for JSON and JSONB (in postgres) using the serde_json crate.
    # "migrate",
    # "chrono",
] }
strum = "0.27.2"
strum_macros = "0.27.2"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["std"] }
tokio = { version = "1.52.1", features = ["full"] }
tokio-stream = {version = "0.1.18", features = ["io-util", "sync"]}
tower = "0.5.3"
tower-cookies = "0.11.0"
tower-http = { version = "0.6.8", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# tracing-test = "0.2.5"

# [[bin]]
# name = "client"
# path = "src/bin/client.rs"

# [[bin]]
# name = "server"
# path = "src/bin/server.rs"

[dev-dependencies]
# reqwest = "0.12.24"
tempfile = "3.27.0"
